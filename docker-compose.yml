# =============================================
# Docker Compose for myonline Platform
# =============================================
# Services:
#   - auth_service      : Spring Boot Authorization Microservice  (port 8081)
#   - tenant_service    : Spring Boot Tenant Microservice         (port 8082)
#   - sys_admin_portal  : React JS System Admin Portal            (port 3000)
# =============================================
# Note: Uses the host machine's MySQL instance.
#       Ensure MySQL is running on the host and
#       accessible with the credentials below.
# =============================================

version: '3.8'

services:

  # -----------------------------------------------
  # Authorization Microservice
  # -----------------------------------------------
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: myonline-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"             # Expose the auth service to the host
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Resolves to the host machine IP (Linux)
    environment:
      # Database connection (points to the host machine's MySQL)
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/myonline?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # JWT Configuration
      APP_JWT_SECRET: myonline-auth-service-super-secret-key-minimum-256-bits-long-for-hs256
      APP_JWT_EXPIRATION_MS: 900000       # 15 minutes
      APP_JWT_REFRESH_EXPIRATION_MS: 604800000  # 7 days

      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"        # Disable SQL logging in production

      # Logging
      LOGGING_LEVEL_COM_MYONLINE: INFO
    networks:
      - myonline-network

  # -----------------------------------------------
  # Tenant Microservice
  # -----------------------------------------------
  tenant_service:
    build:
      context: ./tenant_service
      dockerfile: Dockerfile
    container_name: myonline-tenant-service
    restart: unless-stopped
    ports:
      - "8082:8082"             # Expose the tenant service to the host
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Resolves to the host machine IP (Linux)
    environment:
      # Database connection (points to the host machine's MySQL)
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/myonline?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # JWT Configuration — must match auth_service secret for token validation
      APP_JWT_SECRET: myonline-auth-service-super-secret-key-minimum-256-bits-long-for-hs256

      # Auth Service URL — used for SHOP_ADMIN user creation on tenant approval
      APP_AUTH_SERVICE_URL: http://host.docker.internal:8081

      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"        # Disable SQL logging in production

      # Logging
      LOGGING_LEVEL_COM_MYONLINE: INFO
    networks:
      - myonline-network

  # -----------------------------------------------
  # System Admin Portal (React JS)
  # -----------------------------------------------
  sys_admin_portal:
    build:
      context: ./sys_admin_portal
      dockerfile: Dockerfile
    container_name: myonline-sys-admin-portal
    restart: unless-stopped
    ports:
      - "3000:80"               # React app served by nginx on port 80, exposed as 3000
    depends_on:
      - auth_service
      - tenant_service
    networks:
      - myonline-network

# -----------------------------------------------
# Networks
# -----------------------------------------------
networks:
  myonline-network:
    driver: bridge
    name: myonline-network
