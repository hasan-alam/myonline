# =============================================================
# myonline - Tenant Microservice Configuration
# =============================================================

# -------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------
server.port=8082
spring.application.name=tenant-service

# -------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/myonline?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CRITICAL: Ensures data.sql runs AFTER Hibernate DDL (table creation)
spring.jpa.defer-datasource-initialization=true

# -------------------------------------------------------------
# SQL Seed Data
# -------------------------------------------------------------
# Always run data.sql on startup (uses INSERT IGNORE for idempotency)
spring.sql.init.mode=always

# -------------------------------------------------------------
# JWT Configuration
# IMPORTANT: Must match the secret used in auth_service
# -------------------------------------------------------------
app.jwt.secret=myonline-auth-service-super-secret-key-minimum-256-bits-long-for-hs256

# -------------------------------------------------------------
# Auth Service Integration
# URL of the Authorization Microservice — used for user creation on tenant approval
# -------------------------------------------------------------
app.auth-service.url=http://localhost:8081

# -------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------
logging.level.com.myonline=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# -------------------------------------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
