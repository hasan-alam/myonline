# =============================================
# Application Configuration - Auth Service
# myonline Multi-Tenant E-Commerce Platform
# =============================================

# Server port for the Authorization Microservice
server.port=8081

# Application name (used in logs and service discovery)
spring.application.name=auth-service

# =============================================
# Database Configuration (MySQL)
# =============================================
# createDatabaseIfNotExist=true will auto-create the schema on first run
spring.datasource.url=jdbc:mysql://localhost:3306/myonline?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate Configuration
# =============================================
# update: auto creates/alters tables based on entities (use 'validate' or 'none' in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Defer datasource initialization so data.sql runs after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# =============================================
# SQL Initialization (Seed Data)
# =============================================
# always: seed data is inserted on every startup (uses INSERT IGNORE for idempotency)
spring.sql.init.mode=always

# =============================================
# JWT Configuration
# =============================================
# Secret key for signing JWT tokens (use a strong, random key in production)
app.jwt.secret=myonline-auth-service-super-secret-key-minimum-256-bits-long-for-hs256
# Access token expiry: 15 minutes (in milliseconds)
app.jwt.expiration-ms=900000
# Refresh token expiry: 7 days (in milliseconds)
app.jwt.refresh-expiration-ms=604800000

# =============================================
# Logging Configuration
# =============================================
logging.level.com.myonline=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =============================================
# Swagger / OpenAPI Configuration
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
